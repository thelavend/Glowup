<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>التغيير نحو الأفضل — لوحة متابعة 120 يومًا</title>
<meta name="theme-color" content="#83C9DA">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --sky-l:#B9E5F0; --sky:#83C9DA; --sky-d:#4A9DB3; --sky-dd:#2F7F95;
  --brown-l:#B89578; --brown:#6B4F3A; --cream:#FAF7F2; --white:#FFFFFF;
  --ink:#4A3727; --muted:#8A7766; --line:#EBE3D8; --danger:#A4493D;
  --shadow:0 6px 22px rgba(107,79,58,.08); --radius:20px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{margin:0;background:var(--cream);color:var(--ink);font-family:'Tajawal','Segoe UI',Tahoma,'Noto Naskh Arabic',system-ui,sans-serif;line-height:1.65;font-size:16px;padding-bottom:env(safe-area-inset-bottom)}
body.noscroll{overflow:hidden}
button{font-family:inherit;font-size:inherit;color:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--ink)}
h1,h2,h3,h4{margin:0;color:var(--brown);line-height:1.35}
p{margin:0}
.ic{display:inline-block;vertical-align:middle;flex-shrink:0}
:focus-visible{outline:3px solid var(--sky-d);outline-offset:2px;border-radius:8px}

/* ---------- شريط علوي وتنقل ---------- */
.topbar{position:sticky;top:0;z-index:50;background:var(--cream);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:8px 14px;padding-top:calc(8px + env(safe-area-inset-top))}
.brand{border:0;background:none;display:flex;align-items:center;gap:8px;font-weight:800;color:var(--brown);font-size:1.02rem;padding:4px 6px}
.brand .logo{width:32px;height:32px;border-radius:11px;background:linear-gradient(135deg,var(--sky),var(--sky-d));display:grid;place-items:center;color:#fff}
.icon-btn{border:1px solid var(--line);background:var(--white);width:42px;height:42px;border-radius:13px;display:grid;place-items:center;color:var(--brown)}
.save-ind{margin-inline-start:auto;font-size:.78rem;background:var(--white);border:1px solid var(--line);border-radius:99px;padding:3px 10px;color:var(--muted);display:flex;align-items:center;gap:6px;white-space:nowrap}
.save-ind i{width:8px;height:8px;border-radius:50%;background:var(--sky-d);display:inline-block}
.save-ind.err{color:var(--danger);border-color:#e3b9b2}
.save-ind.err i{background:var(--danger)}
.nav{position:fixed;top:0;bottom:0;right:0;width:min(82%,310px);background:var(--white);z-index:70;transform:translateX(105%);transition:transform .28s ease;padding:70px 14px 20px;display:flex;flex-direction:column;gap:6px;box-shadow:-10px 0 30px rgba(0,0,0,.12);overflow-y:auto}
.nav.open{transform:none}
.nav-btn{border:0;background:none;display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;color:var(--brown);font-weight:500;text-align:start}
.nav-btn.active{background:var(--sky-l);font-weight:800}
.nav-close{position:absolute;top:14px;left:14px}
.nav-overlay{position:fixed;inset:0;background:rgba(60,40,25,.35);z-index:40;opacity:0;pointer-events:none;transition:opacity .25s}
.nav-overlay.show{opacity:1;pointer-events:auto}
@media(min-width:900px){
  #menuBtn,.nav-close,.nav-overlay{display:none}
  .nav{position:static;transform:none;width:auto;padding:0;flex-direction:row;box-shadow:none;background:none;overflow:visible;gap:2px;margin-inline-start:8px}
  .nav-btn{padding:8px 12px;font-size:.92rem;gap:7px}
  .save-ind{margin-inline-start:auto}
}

/* ---------- تخطيط عام ---------- */
main{max-width:1020px;margin:0 auto;padding:16px 14px 60px}
.sec{display:none}
.sec.show{display:block}
.sec-title{display:flex;align-items:center;gap:10px;margin:6px 2px 14px;font-size:1.35rem}
.card{background:var(--white);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:18px;margin-bottom:16px}
.card h3{font-size:1.08rem;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.muted{color:var(--muted)}
.small{font-size:.86rem}
.grid2{display:grid;gap:16px}
@media(min-width:760px){.grid2{grid-template-columns:1fr 1fr}}
.notice{background:#FFF6E8;border:1px solid #EBD5B0;border-radius:14px;padding:12px 14px;color:#6B4F3A;margin-bottom:14px}
.notice.info{background:#EEF8FB;border-color:var(--sky-l)}
.banner{display:none;background:#FBEAE7;color:#7d2f26;border-bottom:1px solid #e3b9b2;padding:10px 14px;font-size:.9rem}
.banner.show{display:block}
.banner button{border:0;background:none;text-decoration:underline;color:inherit;padding:0 6px}

/* ---------- أزرار ---------- */
.btn{border:0;background:var(--sky-d);color:#fff;border-radius:14px;padding:10px 16px;font-weight:700;display:inline-flex;align-items:center;gap:8px;justify-content:center;min-height:44px}
.btn:hover{background:var(--sky-dd)}
.btn.alt{background:var(--white);color:var(--brown);border:1px solid var(--line)}
.btn.alt:hover{background:var(--cream)}
.btn.brown{background:var(--brown)}
.btn.danger{background:var(--danger)}
.btn.sm{padding:6px 12px;min-height:36px;font-size:.88rem;border-radius:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn-row{display:flex;flex-wrap:wrap;gap:10px}
.seg{display:inline-flex;background:var(--cream);border:1px solid var(--line);border-radius:14px;padding:3px;gap:3px}
.seg button{border:0;background:none;padding:7px 14px;border-radius:11px;font-weight:500;color:var(--brown)}
.seg button.on{background:var(--sky-d);color:#fff;font-weight:700}

/* ---------- الواجهة الرئيسية ---------- */
.hero{background:linear-gradient(135deg,var(--sky-l) 0%,#E3F3F7 55%,var(--cream) 100%);border:1px solid var(--line);border-radius:26px;padding:24px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(1.55rem,5.5vw,2.4rem);font-weight:800}
.hero .sub{margin-top:6px;color:var(--brown);font-size:1.02rem}
.hero-dates{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.pill{background:rgba(255,255,255,.85);border-radius:14px;padding:8px 13px;font-size:.88rem;color:var(--brown);display:flex;align-items:center;gap:7px}
.pill b{font-weight:800}
.counter{margin-top:16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.counter .big{font-size:2.1rem;font-weight:800;color:var(--brown);line-height:1}
.counter .big small{font-size:1rem;font-weight:500;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:16px}
@media(min-width:700px){.stats{grid-template-columns:repeat(3,1fr)}}
.stat{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.stat .si{width:36px;height:36px;border-radius:12px;background:var(--sky-l);color:var(--sky-dd);display:grid;place-items:center;margin-bottom:8px}
.stat:nth-child(even) .si{background:#F1E5DA;color:var(--brown)}
.stat .v{font-size:1.55rem;font-weight:800;color:var(--brown);line-height:1.2}
.stat .v small{font-size:.85rem;font-weight:500;color:var(--muted)}
.stat .l{font-size:.86rem;color:var(--muted)}
.big-progress{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.big-progress .bars{flex:1;min-width:220px}
.ring{display:block}
.ring-fg{animation:none}
.anim .ring-fg{animation:ringIn .9s ease}
@keyframes ringIn{from{stroke-dasharray:0 283}}
.bar{height:12px;background:#EEF4F6;border-radius:99px;overflow:hidden}
.bar.lg{height:18px}
.bar i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--sky),var(--sky-d))}
.bar.br i{background:linear-gradient(90deg,var(--brown-l),var(--brown))}
.anim .bar i{animation:grow .9s ease}
@keyframes grow{from{width:0}}
.bar-label{display:flex;justify-content:space-between;font-size:.86rem;margin:10px 0 5px;color:var(--brown)}
.quote{background:linear-gradient(135deg,#F6EDE4,#fff);text-align:center;font-size:1.12rem;color:var(--brown);font-weight:500;padding:22px 18px}
.quote .q{margin-bottom:10px}

/* ---------- العادات ---------- */
.day-nav{display:flex;align-items:center;gap:8px;margin-bottom:14px;flex-wrap:wrap}
.day-nav .t{flex:1;text-align:center;min-width:150px}
.day-nav .t b{display:block;color:var(--brown);font-size:1.1rem}
.day-prog{margin-bottom:12px}
.day-prog .row{display:flex;justify-content:space-between;font-size:.9rem;color:var(--brown);margin-bottom:5px}
.habit-list{display:flex;flex-direction:column;gap:10px}
.habit{background:var(--cream);border:1px solid var(--line);border-radius:16px;padding:11px 12px;transition:background .2s,border-color .2s}
.habit.done{background:#E8F5F9;border-color:var(--sky)}
.h-main{display:flex;align-items:center;gap:12px}
.h-ic{width:40px;height:40px;border-radius:13px;background:var(--white);color:var(--sky-dd);display:grid;place-items:center;flex-shrink:0;border:1px solid var(--line)}
.h-name{font-weight:700;color:var(--brown);flex:1}
.h-sub{font-size:.8rem;color:var(--muted);font-weight:400;display:block}
.chk{width:34px;height:34px;border-radius:11px;border:2px solid var(--sky);background:var(--white);display:grid;place-items:center;color:transparent;padding:0;transition:all .18s;flex-shrink:0}
.chk.br{border-color:var(--brown-l)}
.chk.on{background:var(--sky-d);border-color:var(--sky-d);color:#fff}
.chk.br.on{background:var(--brown);border-color:var(--brown)}
.chk:disabled{opacity:.4;cursor:not-allowed}
.chk:not(:disabled):active{transform:scale(.9)}
.steps-box{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.steps-box label{display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:.88rem;color:var(--brown);margin-bottom:8px}
.inp{border:1px solid var(--line);background:var(--white);border-radius:12px;padding:8px 12px;width:130px;text-align:center;font-weight:700}
.inp.wide{width:100%;text-align:start;font-weight:500}
.steps-txt{display:block;margin-top:5px;font-size:.8rem;color:var(--muted)}
.sub-title{margin:18px 0 10px;font-size:1rem;color:var(--brown);font-weight:800;display:flex;align-items:center;gap:8px}
textarea.note{width:100%;min-height:120px;border:1px solid var(--line);border-radius:14px;padding:12px;resize:vertical;background:#FFFEFC;line-height:1.7}
.lbl{display:block;font-size:.9rem;font-weight:700;color:var(--brown);margin:14px 0 6px}

/* ---------- الجدول ---------- */
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:.82rem;color:var(--muted);margin-bottom:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.dot{width:14px;height:14px;border-radius:5px;display:inline-block}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.tools select{border:1px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--white);min-height:44px;max-width:100%;flex:1;min-width:150px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:16px;background:var(--white)}
table.grid{border-collapse:separate;border-spacing:0;width:100%;min-width:600px}
table.grid th{background:#F3EBE2;color:var(--brown);font-size:.78rem;font-weight:700;padding:8px 4px;position:sticky;top:0;white-space:nowrap}
table.grid td{padding:6px 4px;text-align:center;border-top:1px solid var(--line);background:var(--rowbg,#fff);font-size:.86rem}
table.grid th:first-child,table.grid td:first-child{position:sticky;inset-inline-start:0;z-index:2;min-width:44px}
table.grid th:first-child{background:#F3EBE2}
.r-full{--rowbg:#DDF1F7}
.r-partial{--rowbg:#F4FAFC}
.r-none{--rowbg:#F8EEE5}
.r-future{--rowbg:#F5F2EC;color:var(--muted)}
.is-today td:first-child{box-shadow:inset -4px 0 0 var(--brown)}
.c-date{white-space:nowrap}
.linkish{border:0;background:none;color:var(--brown);font-weight:700;padding:6px 4px;min-height:34px;border-radius:8px}
.linkish:hover{background:rgba(131,201,218,.25)}
.c-pct{min-width:78px}
.c-pct .mini{height:6px;background:#E6EEF1;border-radius:9px;overflow:hidden;margin-bottom:2px}
.c-pct .mini i{display:block;height:100%;background:var(--sky-d)}
.c-pct span{font-size:.76rem;font-weight:700;color:var(--brown)}
tr.wk td{background:var(--sky-l)!important;font-weight:800;color:var(--brown);text-align:start;padding:8px 12px}
td .chk{width:30px;height:30px;border-radius:9px;margin:0 auto}

/* ---------- التقويم ---------- */
.cal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.cal-head b{font-size:1.05rem;color:var(--brown)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.cal .wd{text-align:center;font-size:.74rem;color:var(--muted);font-weight:700;padding:2px 0}
.cal button,.cal .empty{aspect-ratio:1/1;border-radius:12px;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:700;font-size:.92rem;line-height:1.1;position:relative;min-height:38px}
.cal button small{font-size:.6rem;font-weight:500;opacity:.8}
.cal .full{background:var(--sky-d);color:#fff}
.cal .partial{background:var(--sky-l);color:var(--brown)}
.cal .none{background:var(--brown-l);color:#fff}
.cal .future{background:#EFEAE2;color:#9a8b7b}
.cal .out{background:transparent;color:#cfc6ba;cursor:default;font-weight:400}
.cal .tdy{box-shadow:0 0 0 3px var(--brown)}

/* ---------- أسبوعي ---------- */
.week-card{border-inline-start:6px solid var(--sky)}
.week-card.cur{border-inline-start-color:var(--brown)}
.wk-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.badge{background:var(--sky-l);color:var(--brown);border-radius:99px;padding:4px 12px;font-weight:800;font-size:.9rem;white-space:nowrap}
.badge.br{background:#F1E5DA}
.act{padding:12px 0;border-top:1px dashed var(--line)}
.act:first-of-type{border-top:0}
.act-top{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.act-top .h-ic{width:36px;height:36px}
.act-top b{flex:1;color:var(--brown)}
.slots{display:flex;flex-wrap:wrap;gap:10px;margin:10px 0 6px}
.slot{display:flex;flex-direction:column;align-items:center;gap:3px;min-width:54px}
.slot small{font-size:.7rem;color:var(--muted);white-space:nowrap}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;align-items:center}
.chip{border:1px solid var(--brown-l);background:#F8EEE5;color:var(--brown);border-radius:99px;padding:3px 10px;font-size:.78rem;display:inline-flex;align-items:center;gap:4px}
.goal-ok{margin-top:6px;color:var(--sky-dd);font-weight:800;font-size:.88rem}
.act-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.pick-list{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}
.pick-list button{border:1px solid var(--line);background:var(--cream);border-radius:12px;padding:10px;font-weight:700;color:var(--brown)}
.pick-list button:hover{background:var(--sky-l)}

/* ---------- إحصائيات ---------- */
.hab-grid{display:grid;grid-template-columns:1fr;gap:12px}
@media(min-width:620px){.hab-grid{grid-template-columns:1fr 1fr}}
@media(min-width:900px){.hab-grid{grid-template-columns:repeat(3,1fr)}}
.hab-card{background:var(--white);border:1px solid var(--line);border-radius:18px;padding:14px;box-shadow:var(--shadow)}
.hab-card .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hab-card .top b{flex:1;color:var(--brown)}
.hab-card .num{font-size:1.5rem;font-weight:800;color:var(--brown)}
.hab-card .num small{font-size:.8rem;color:var(--muted);font-weight:500}
.chart-wrap{overflow-x:auto}
.legend-line{display:flex;gap:16px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin-top:6px}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px dashed var(--line);gap:10px}
.kv:last-child{border-bottom:0}
.kv b{color:var(--brown)}
.final{background:linear-gradient(135deg,#E3F3F7,#F6EDE4);border:1px solid var(--sky);border-radius:22px;padding:20px;margin-bottom:16px}

/* ---------- مذكرات ---------- */
.note-item{display:block;width:100%;text-align:start;border:1px solid var(--line);background:var(--white);border-radius:14px;padding:12px;margin-bottom:8px}
.note-item:hover{background:var(--cream)}
.note-item b{color:var(--brown);display:block;font-size:.9rem}
.note-item span{color:var(--ink);font-size:.9rem;white-space:pre-wrap;word-break:break-word}
.chips-q{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}

/* ---------- نوافذ ---------- */
.overlay{position:fixed;inset:0;background:rgba(60,40,25,.45);z-index:100;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:var(--white);border-radius:22px;width:100%;max-width:540px;max-height:92vh;overflow:auto;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
.m-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin-bottom:12px}
.m-head h3{font-size:1.08rem}
.m-foot{display:flex;gap:10px;justify-content:space-between;margin-top:14px;flex-wrap:wrap}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%) translateY(30px);background:var(--brown);color:#fff;padding:10px 18px;border-radius:14px;z-index:200;opacity:0;pointer-events:none;transition:all .3s;max-width:90%;text-align:center;font-size:.92rem}
.toast.show{opacity:1;transform:translateX(-50%)}
input[type=date]{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:var(--white);min-height:44px}
.setting{padding:14px 0;border-top:1px dashed var(--line)}
.setting:first-of-type{border-top:0;padding-top:0}
.eyebrow{display:inline-block;background:rgba(255,255,255,.85);color:var(--sky-dd);font-weight:800;border-radius:99px;padding:3px 16px;font-size:.92rem;margin-bottom:10px}
.foot{text-align:center;color:var(--muted);padding:18px 14px calc(28px + env(safe-area-inset-bottom));font-size:.92rem;border-top:1px solid var(--line);max-width:1020px;margin:0 auto}
.foot bdi{font-weight:700;color:var(--brown)}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt,.optk{position:relative;display:inline-block}
.opt input,.optk input{position:absolute;opacity:0;inset:0;margin:0;cursor:pointer}
.opt span{width:42px;height:42px;border:2px solid var(--line);border-radius:12px;display:grid;place-items:center;color:var(--brown)}
.opt input:checked+span{border-color:var(--sky-d);background:var(--sky-l)}
.optk span{display:block;padding:7px 18px;border-radius:11px}
.optk input:checked+span{background:var(--sky-d);color:#fff;font-weight:700}
.opt input:focus-visible+span,.optk input:focus-visible+span{outline:3px solid var(--sky-d)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="banner" class="banner" role="alert"></div>

<header class="topbar">
  <button id="menuBtn" class="icon-btn" aria-label="فتح القائمة" aria-expanded="false" data-act="menu"></button>
  <button class="brand" data-act="nav" data-tab="home" aria-label="الرئيسية">
    <span class="logo" id="logoIc"></span><span>رحلتي · ١٢٠</span>
  </button>
  <nav id="nav" class="nav" aria-label="التنقل الرئيسي"></nav>
  <div id="saveInd" class="save-ind" aria-live="polite"></div>
</header>
<div id="navOverlay" class="nav-overlay" data-act="menuClose"></div>

<main id="main">
  <section id="sec-home" class="sec"></section>
  <section id="sec-today" class="sec"></section>
  <section id="sec-table" class="sec"></section>
  <section id="sec-weekly" class="sec"></section>
  <section id="sec-stats" class="sec"></section>
  <section id="sec-notes" class="sec"></section>
  <section id="sec-settings" class="sec"></section>
</main>
<footer class="foot">حقوق <bdi dir="ltr">luvmaria</bdi></footer>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
(function(){
'use strict';

/* =====================================================================
   ١) الثوابت والبيانات الأساسية
   ===================================================================== */
const KEY = 'rahlati-120-tracker:v1';      // مفتاح التخزين الخاص بالموقع
const TOTAL = 120;
const STEP_GOAL = 10000;

/* =====================================================================
   ٢) أدوات التواريخ (محلية بالكامل — بلا مشاكل المناطق الزمنية)
   ===================================================================== */
const pad = n => String(n).padStart(2,'0');
function isoOf(d){ return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function parseISO(s){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || '');
  if(!m) return null;
  const d = new Date(+m[1], +m[2]-1, +m[3]);
  if(d.getFullYear()!==+m[1] || d.getMonth()!==+m[2]-1 || d.getDate()!==+m[3]) return null;
  return d;
}
function dayNum(d){ return Math.round(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate())/864e5); }
function addDays(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function today(){ const n=new Date(); return new Date(n.getFullYear(), n.getMonth(), n.getDate()); }
const fmtFull  = d => DAYS[d.getDay()]+' '+d.getDate()+' '+MONTHS[d.getMonth()]+' '+d.getFullYear();
const fmtMid   = d => d.getDate()+' '+MONTHS[d.getMonth()];
const fmtShort = d => d.getDate()+'/'+(d.getMonth()+1);
function dayWord(n){ return n===1?'يوم':n===2?'يومين':n<=10?'أيام':'يومًا'; }
/* التاريخ الهجري (أم القرى) */
let HIJRI = null;
try{
  const f = new Intl.DateTimeFormat('ar-SA-u-ca-islamic-umalqura-nu-latn', {day:'numeric', month:'long', year:'numeric'});
  const tp = f.formatToParts(new Date(2026,9,28,12));
  if(tp.some(x=>x.type==='month') && tp.some(x=>x.type==='year')) HIJRI = f;
}catch(e){}
function fmtHijri(d){
  if(!HIJRI) return fmtMid(d)+' '+d.getFullYear()+' م';
  const p = {};
  HIJRI.formatToParts(new Date(d.getFullYear(), d.getMonth(), d.getDate(), 12)).forEach(x => { p[x.type] = x.value; });
  return p.day+' '+p.month+' '+p.year+' هـ';
}
const dualHTML = d => '<b>'+DAYS[d.getDay()]+' '+fmtHijri(d)+'</b> <small class="muted">('+fmtMid(d)+' '+d.getFullYear()+' م)</small>';

/* تنقية البيانات (عند التحميل والاستيراد) */
function sanitize(o){
  if(o && o.app==='rahlati120' && o.data) o = o.data;
  if(!o || typeof o!=='object') throw new Error('invalid');
  if(!parseISO(o.startDate)) throw new Error('invalid start date');
  const s = defaultState();
  s.startDate = o.startDate;
  const cu = (o.custom && typeof o.custom==='object') ? o.custom : {};
  const okId = x => typeof x==='string' && /^c[a-z0-9]{3,20}$/.test(x);
  const okIcon = x => CUSTOM_ICONS.indexOf(x)>=0 ? x : 'star';
  const cleanName = x => String(x).replace(/[<>&"'`]/g,'').replace(/\s+/g,' ').trim().slice(0,40);
  const seen = {};
  (Array.isArray(cu.daily) ? cu.daily : []).slice(0,MAX_CUSTOM).forEach(c => {
    if(!c || !okId(c.id) || seen[c.id] || typeof c.name!=='string' || !cleanName(c.name)) return;
    seen[c.id] = 1;
    s.custom.daily.push({id:c.id, name:cleanName(c.name), icon:okIcon(c.icon), from:Number.isInteger(c.from)?Math.max(1,Math.min(TOTAL,c.from)):1});
  });
  (Array.isArray(cu.weekly) ? cu.weekly : []).slice(0,MAX_CUSTOM).forEach(c => {
    if(!c || !okId(c.id) || seen[c.id] || typeof c.name!=='string' || !cleanName(c.name)) return;
    seen[c.id] = 1;
    s.custom.weekly.push({id:c.id, name:cleanName(c.name), icon:okIcon(c.icon), goal:Number.isInteger(c.goal)?Math.max(1,Math.min(7,c.goal)):1, fromW:Number.isInteger(c.fromW)?Math.max(1,Math.min(WEEKS,c.fromW)):1});
  });
  const hab = BASE_HABITS.concat(s.custom.daily), wkl = BASE_WEEKLY.concat(s.custom.weekly);
  const days = (o.days && typeof o.days==='object') ? o.days : {};
  Object.keys(days).forEach(k => {
    const i = +k; if(!Number.isInteger(i) || i<1 || i>TOTAL) return;
    const src = days[k]; if(!src || typeof src!=='object') return;
    const d = emptyDay();
    hab.forEach(h => d[h.id] = src[h.id]===true);
    d.stepsAuto = src.stepsAuto===true;
    const sc = src.stepCount;
    d.stepCount = (typeof sc==='number' && isFinite(sc) && sc>=0) ? Math.min(200000, Math.round(sc)) : null;
    d.note = typeof src.note==='string' ? src.note.slice(0,3000) : '';
    s.days[i] = d;
  });
  const wk = (o.weekly && typeof o.weekly==='object') ? o.weekly : {};
  Object.keys(wk).forEach(k => {
    const w = +k; if(!Number.isInteger(w) || w<1 || w>WEEKS) return;
    const r = weekRange(w); s.weekly[w] = {};
    wkl.forEach(a => {
      const arr = Array.isArray(wk[k] && wk[k][a.id]) ? wk[k][a.id] : [];
      const clean = [];
      arr.forEach(x => { if(Number.isInteger(x) && x>=r.s && x<=r.e && clean.indexOf(x)<0) clean.push(x); });
      clean.sort((p,q)=>p-q);
      s.weekly[w][a.id] = clean;
    });
  });
  const st = o.settings || {};
  s.settings.mode = st.mode==='total' ? 'total' : 'due';
  s.settings.tableAll = st.tableAll===true;
  s.settings.weeklyAll = st.weeklyAll===true;
  s.settings.lastBackup = (typeof st.lastBackup==='number' && isFinite(st.lastBackup)) ? st.lastBackup : null;
  return s;
}

function load(){
  let raw = null, firstRun = false;
  try{ raw = localStorage.getItem(KEY); }
  catch(e){ storageOK = false; loadWarning = 'تعذّر الوصول إلى التخزين المحلي في هذا المتصفح (قد يكون وضع التصفح الخاص أو منع التخزين). لن تُحفظ البيانات بعد إغلاق الصفحة.'; }
  if(raw){
    try{ state = sanitize(JSON.parse(raw)); rebuildTasks(); return false; }
    catch(e){
      loadWarning = 'تعذّرت قراءة البيانات المحفوظة سابقًا (قد تكون تالفة). تم الاحتفاظ بنسخة منها في المتصفح تحت المفتاح «'+KEY+':corrupt» وبدأت لوحة جديدة.';
      try{ localStorage.setItem(KEY+':corrupt', raw); }catch(_){}
    }
  }
  state = defaultState(); rebuildTasks();
  return true;
}

}

  else if(loadWarning) msg = loadWarning + ' <button data-act="dismissBanner">إخفاء</button>';

   ٤) منطق الرحلة والحسابات
   ===================================================================== */
const startDate = () => parseISO(state.startDate);
const dateOfDay = i => addDays(startDate(), i-1);
function todayIdx(){ return dayNum(today()) - dayNum(startDate()) + 1; }   // <1 لم تبدأ، >120 انتهت
function dueDays(){ return Math.max(0, Math.min(TOTAL, todayIdx())); }
const canEdit = i => i>=1 && i<=TOTAL && i<=todayIdx();

function ensureDay(i){ if(!state.days[i]) state.days[i] = emptyDay(); return state.days[i]; }
function rebuildTasks(){
  const c = state.custom || {daily:[], weekly:[]};
  HABITS = BASE_HABITS.concat(c.daily.map(x => ({id:x.id, name:x.name, short:x.name.length>9 ? x.name.slice(0,9)+'…' : x.name, icon:x.icon, from:x.from, custom:true})));
  WEEKLY = BASE_WEEKLY.concat(c.weekly.map(x => ({id:x.id, name:x.name, goal:x.goal, icon:x.icon, hint:x.goal+' '+(x.goal===1?'مرة':'مرات')+' في الأسبوع', fromW:x.fromW, custom:true})));
}
const habitsOn = i => HABITS.filter(h => !h.from || h.from <= i);
const goalsOn = i => habitsOn(i).length;
function dayDone(i){ const d = state.days[i]; if(!d) return 0; let n=0; habitsOn(i).forEach(h => { if(d[h.id]) n++; }); return n; }
function dayState(i){
  if(i > todayIdx()) return 'future';
  const n = dayDone(i);
  return n===goalsOn(i) ? 'full' : n>0 ? 'partial' : 'none';
}
const weekGoal = (a,w) => (a.fromW && w < a.fromW) ? 0 : Math.min(a.goal, weekRange(w).len);
function weekRaw(w,aid){
  if(!state.weekly[w]) state.weekly[w] = {};
  if(!state.weekly[w][aid]) state.weekly[w][aid] = [];
  return state.weekly[w][aid];
}
function weekArr(w,aid){
  const raw = (state.weekly[w] && state.weekly[w][aid]) || [];
  const dd = dueDays();
  return raw.filter(x => x<=dd);
}
function weeklyDueFor(a,w,t){
  const r = weekRange(w); if(t < r.s) return 0;
  const g = weekGoal(a,w);
  if(t >= r.e) return g;
  return Math.floor(g * (t - r.s + 1) / r.len);
}
function weekPct(w){   // التزام الأسبوع (يومي + أسبوعي)
  const r = weekRange(w), dd = dueDays();
  let done = 0, goal = 0;
  for(let i=r.s; i<=r.e; i++) goal += goalsOn(i);
  for(let i=r.s; i<=Math.min(r.e,dd); i++) done += dayDone(i);
  WEEKLY.forEach(a => { done += Math.min(weekArr(w,a.id).length, weekGoal(a,w)); goal += weekGoal(a,w); });
  return goal ? done/goal : 0;
}
function weekWeeklyPct(w){  // التزام الأنشطة الأسبوعية فقط
  let done=0, goal=0;
  WEEKLY.forEach(a => { done += Math.min(weekArr(w,a.id).length, weekGoal(a,w)); goal += weekGoal(a,w); });
  return goal ? done/goal : 0;
}

function computeStats(){
  const t = todayIdx(), dd = dueDays();
  const habits = HABITS.map(h => {
    const f = h.from || 1; let done = 0;
    for(let i=f;i<=dd;i++){ const d=state.days[i]; if(d && d[h.id]) done++; }
    return {h:h, done:done, due:Math.max(0,dd-f+1), total:TOTAL-f+1};
  });
  let dailyDone=0, fullDays=0, best=0, cur=0;
  for(let i=1;i<=dd;i++){
    const n = dayDone(i); dailyDone += n;
    if(n===goalsOn(i)){ fullDays++; cur++; if(cur>best) best=cur; } else cur=0;
  }
  let curStreak = 0;
  { let i = dd;
    if(i>=1 && t<=TOTAL && dayDone(i)<goalsOn(i)) i--;
    while(i>=1 && dayDone(i)===goalsOn(i)){ curStreak++; i--; } }
  const weekly = WEEKLY.map(a => ({a:a, done:0, due:0, goal:0}));
  for(let w=1; w<=WEEKS; w++){
    WEEKLY.forEach((a,k) => {
      const g = weekGoal(a,w);
      weekly[k].goal += g;
      weekly[k].done += Math.min(weekArr(w,a.id).length, g);
      weekly[k].due  += weeklyDueFor(a,w,t);
    });
  }
  let dailyTotal = 0, dailyDue = 0;
  for(let i=1;i<=TOTAL;i++){ const g = goalsOn(i); dailyTotal += g; if(i<=dd) dailyDue += g; }
  let wDone=0, wTotal=0, wDue=0, wDueDone=0;
  weekly.forEach(x => { wDone+=x.done; wTotal+=x.goal; wDue+=x.due; wDueDone+=Math.min(x.done,x.due); });
  const totalGoals = dailyTotal + wTotal;
  const doneAll = dailyDone + wDone;
  const dueTarget = dailyDue + wDue;
  const dueDone = dailyDone + wDueDone;
  const mode = state.settings.mode;
  const overall = mode==='due' ? (dueTarget ? dueDone/dueTarget : 0) : doneAll/totalGoals;
  const dailyPct = mode==='due' ? (dailyDue ? dailyDone/dailyDue : 0) : dailyDone/dailyTotal;
  const weeklyPct = mode==='due' ? (wDue ? wDueDone/wDue : 0) : wDone/wTotal;
  // أفضل أسبوع
  let bestW = 0, bestWp = 0;
  for(let w=1; w<=WEEKS; w++){
    if(weekRange(w).s > dd) break;
    const p = weekPct(w);
    if(p > bestWp){ bestWp = p; bestW = w; }
  }
  const curW = (t>=1 && t<=TOTAL) ? weekOf(t) : 0;
  return {t:t, dd:dd, habits:habits, weekly:weekly, dailyDone:dailyDone, dailyTotal:dailyTotal, dailyDue:dailyDue,
          wDone:wDone, wTotal:wTotal, wDue:wDue, totalGoals:totalGoals, doneAll:doneAll, dueTarget:dueTarget,
          overall:overall, dailyPct:dailyPct, weeklyPct:weeklyPct, fullDays:fullDays, best:best, curStreak:curStreak,
          bestW:bestW, bestWp:bestWp, curW:curW, curWp: curW ? weekPct(curW) : 0, mode:mode};
}

function toggleHabit(i, hid){
  if(!canEdit(i)) return;
  const d = ensureDay(i);
  d[hid] = !d[hid];
  if(hid==='steps') d.stepsAuto = false;
  commit();
}
function setSteps(i, n){
  const d = ensureDay(i);
  d.stepCount = n;
  if(n!==null && n >= STEP_GOAL){ d.steps = true; d.stepsAuto = true; }
  else if(d.stepsAuto){ d.steps = false; d.stepsAuto = false; }
}
function toggleWeeklyDay(i, aid){
  if(!canEdit(i)) return;
  const raw = weekRaw(weekOf(i), aid), k = raw.indexOf(i);
  if(k>=0) raw.splice(k,1); else { raw.push(i); raw.sort((p,q)=>p-q); }
  commit();
}
function pushWeekly(w, aid, i){
  const a = WEEKLY.filter(x=>x.id===aid)[0];
  const raw = weekRaw(w, aid);
  if(raw.indexOf(i)>=0) return;
  raw.push(i); raw.sort((p,q)=>p-q);
  commit();
  if(weekArr(w,aid).length === weekGoal(a,w)) toast('تم تحقيق الهدف الأسبوعي ✓');
}
function addWeekly(w, aid, forcePick){
  const t = todayIdx(), r = weekRange(w);
  if(t < r.s){ toast('هذا الأسبوع لم يبدأ بعد.'); return; }
  const raw = weekRaw(w, aid), avail = [];
  for(let i=r.s; i<=Math.min(r.e,t); i++) if(raw.indexOf(i)<0) avail.push(i);
  if(!avail.length){ toast('كل الأيام المتاحة في هذا الأسبوع مسجّلة لهذا النشاط.'); return; }
  if(!forcePick && avail.indexOf(t)>=0){ pushWeekly(w, aid, t); return; }
  openPicker(w, aid, avail);
}

  let key = Math.max(minK, Math.min(maxK, ui.calY*12+ui.calM));
  const y = Math.floor(key/12), m = key%12; ui.calY = y; ui.calM = m;
  const first = new Date(y,m,1), off = (first.getDay()+1)%7, dim = new Date(y,m+1,0).getDate();
  const wd = ['سبت','أحد','اثنين','ثلاثاء','أربعاء','خميس','جمعة'];
  let h = '<div class="cal-head"><button class="icon-btn" data-act="calnav" data-d="-1" aria-label="الشهر السابق" '+(key<=minK?'disabled':'')+'>'+icon('chevR')+'</button><b>'+MONTHS[m]+' '+y+'</b>'+
    '<button class="icon-btn" data-act="calnav" data-d="1" aria-label="الشهر التالي" '+(key>=maxK?'disabled':'')+'>'+icon('chevL')+'</button></div><div class="cal">';
  wd.forEach(x => h += '<div class="wd">'+x+'</div>');
  for(let k=0;k<off;k++) h += '<div class="empty"></div>';
  for(let d=1; d<=dim; d++){
    const dt = new Date(y,m,d), idx = dayNum(dt)-dayNum(st)+1;
    if(idx<1 || idx>TOTAL){ h += '<button class="out" tabindex="-1" disabled aria-hidden="true">'+d+'</button>'; continue; }
    h += '<button class="'+dayState(idx)+(idx===t?' tdy':'')+'" data-act="opday" data-day="'+idx+'" aria-label="'+fmtFull(dt)+' — اليوم '+idx+'">'+d+'<small>'+idx+'</small></button>';
  }
  return h + '</div>';
}

/* ---------- العادات الأسبوعية ---------- */
function weekCardHTML(w){
  const r = weekRange(w), t = todayIdx(), ds = dateOfDay(r.s), de = dateOfDay(r.e);
  const started = t >= r.s, cur = t>=r.s && t<=r.e, ended = t > r.e;
  let h = '<div class="card week-card'+(cur?' cur':'')+'"><div class="wk-head"><div><h3 style="margin:0">الأسبوع '+w+'</h3>'+
    '<div class="muted small">'+fmtMid(ds)+' – '+fmtMid(de)+' · '+r.len+' '+(r.len===1?'يوم':'أيام')+(cur?' · الأسبوع الحالي':ended?' · منتهٍ':' · لم يبدأ')+'</div></div>'+
    '<span class="badge'+(cur?' br':'')+'">'+(started ? pct(weekWeeklyPct(w))+'%' : '—')+'</span></div>';
  WEEKLY.forEach(a => {
    const g = weekGoal(a,w); if(!g) return;
    const arr = weekArr(w,a.id), c = arr.length, p = pct(Math.min(c,g)/g);
    let slots = '';
    for(let k=0;k<g;k++){
      const x = arr[k];
      if(x!==undefined){ const dt = dateOfDay(x);
        slots += '<div class="slot"><button class="chk br on" role="checkbox" aria-checked="true" aria-label="إلغاء إنجاز '+a.name+'" data-act="wslot" data-w="'+w+'" data-a="'+a.id+'" data-k="'+k+'">'+icon('check',18)+'</button><small>'+DAYS_S[dt.getDay()]+' '+fmtShort(dt)+'</small></div>';
      }else{
        slots += '<div class="slot"><button class="chk br" role="checkbox" aria-checked="false" aria-label="تسجيل '+a.name+'" data-act="wslot" data-w="'+w+'" data-a="'+a.id+'" data-k="'+k+'" '+(started?'':'disabled')+'>'+icon('check',18)+'</button><small>&nbsp;</small></div>';
      }
    }
    const extras = arr.slice(g);
    h += '<div class="act"><div class="act-top"><span class="h-ic">'+icon(a.icon,20)+'</span><b>'+a.name+'<span class="h-sub">'+a.hint+(g<a.goal?' — الهدف '+g+' لقصر الأسبوع':'')+'</span></b><b>'+Math.min(c,g)+'/'+g+'</b></div>'+
      '<div class="bar br"><i style="width:'+p+'%"></i></div><div class="slots">'+slots+'</div>';
    if(extras.length) h += '<div class="chips"><span class="small muted">إنجازات إضافية:</span>'+extras.map((x,j) => { const dt=dateOfDay(x);
      return '<span class="chip">'+DAYS_S[dt.getDay()]+' '+fmtShort(dt)+'<button style="border:0;background:none;padding:0;color:inherit" aria-label="حذف الإنجاز الإضافي" data-act="wrem" data-w="'+w+'" data-a="'+a.id+'" data-k="'+(g+j)+'">'+icon('x',13)+'</button></span>'; }).join('')+'</div>';
    if(c>=g) h += '<div class="goal-ok">تم تحقيق الهدف الأسبوعي ✓</div>';
    if(started) h += '<div class="act-tools"><button class="btn alt sm" data-act="wpick" data-w="'+w+'" data-a="'+a.id+'">'+icon('calendar',15)+'تسجيل في يوم آخر</button>'+
      (c>=g ? '<button class="btn alt sm" data-act="wadd" data-w="'+w+'" data-a="'+a.id+'">'+icon('plus',15)+'إنجاز إضافي</button>' : '')+'</div>';
    h += '</div>';
  });
  return h + '</div>';
}

/* ---------- الإحصائيات ---------- */
function chartHTML(){
  const dd = dueDays();
  if(dd < 1) return '<p class="muted">سيظهر الرسم البياني بعد بداية الرحلة.</p>';
  const W=640,H=230,pl=10,pr=34,pt=12,pb=26, iw=W-pl-pr, ih=H-pt-pb, bw=iw/TOTAL;
  let g = '<svg viewBox="0 0 '+W+' '+H+'" width="100%" style="min-width:520px;display:block" role="img" aria-label="تطور الإنجاز اليومي">';
  [0,50,100].forEach(v => { const y = pt+ih-(v/100)*ih;
    g += '<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y+'" y2="'+y+'" stroke="#EBE3D8" stroke-dasharray="3 4"/><text x="'+(W-pr+6)+'" y="'+(y+4)+'" font-size="10" fill="#8A7766" font-family="inherit">'+v+'%</text>'; });
  let sum = 0, gsum = 0, pts = [];
  for(let i=1;i<=dd;i++){
    const n = dayDone(i), gl = goalsOn(i); sum += n; gsum += gl; const p = n/gl;
    const x = W-pr-i*bw, hh = p*ih;
    if(hh>0) g += '<rect x="'+(x+.6).toFixed(2)+'" y="'+(pt+ih-hh).toFixed(2)+'" width="'+Math.max(1,bw-1.2).toFixed(2)+'" height="'+hh.toFixed(2)+'" rx="1.5" fill="#83C9DA"/>';
    pts.push((W-pr-(i-.5)*bw).toFixed(2)+','+(pt+ih-(sum/gsum)*ih).toFixed(2));
  }
  g += '<polyline points="'+pts.join(' ')+'" fill="none" stroke="#6B4F3A" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round"/>';
  [1,20,40,60,80,100,120].forEach(i => { g += '<text x="'+(W-pr-(i-.5)*bw).toFixed(1)+'" y="'+(H-8)+'" font-size="10" text-anchor="middle" fill="#8A7766" font-family="inherit">'+i+'</text>'; });
  return '<div class="chart-wrap">'+g+'</svg></div><div class="legend-line"><span><i class="dot" style="background:#83C9DA"></i>الإنجاز اليومي</span><span><i class="dot" style="background:#6B4F3A"></i>المتوسط التراكمي</span><span>المحور الأفقي: رقم اليوم</span></div>';
}

let toastTimer = null;
function toast(msg){
  const el = $('#toast'); el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}
function openModal(html, opts){
  closeModal(true);
  const ov = document.createElement('div'); ov.className = 'overlay';
  ov.innerHTML = '<div class="modal" role="dialog" aria-modal="true">'+html+'</div>';
  ov.addEventListener('click', e => { if(e.target===ov) closeModal(); });
  document.body.appendChild(ov); document.body.classList.add('noscroll');
  modalOpen = Object.assign({el:ov}, opts || {});
}
function closeModal(silent){
  if(!modalOpen) return;

}

function download(name, text, type){
  const blob = new Blob([text], {type:type});
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click();
  setTimeout(() => { a.remove(); URL.revokeObjectURL(url); }, 600);
}
function exportJSON(){
  state.settings.lastBackup = Date.now(); save();
  const payload = {app:'rahlati120', version:1, exportedAt:new Date().toISOString(), data:state};
  download('rahlati-120-backup-'+isoOf(today())+'.json', JSON.stringify(payload,null,2), 'application/json');
  toast('تم تصدير النسخة الاحتياطية.'); renderActive();
}

  for(let i=1;i<=TOTAL;i++){
    const d = state.days[i] || emptyDay(), fut = i>t;
    rows.push([i, isoOf(dateOfDay(i))].concat(HABITS.map(h => (fut || (h.from && h.from>i)) ? '' : (d[h.id]?'نعم':'لا')), [d.stepCount==null?'':d.stepCount, fut?'':pct(dayDone(i)/goalsOn(i)), d.note]));
  }
  rows.push([]); rows.push(['العادات الأسبوعية']);
  rows.push(['الأسبوع','من','إلى','النشاط','الهدف','المنجز','أيام الإنجاز']);
  for(let w=1; w<=WEEKS; w++){ const r = weekRange(w);
    WEEKLY.forEach(a => { const arr = weekArr(w,a.id);
      rows.push([w, isoOf(dateOfDay(r.s)), isoOf(dateOfDay(r.e)), a.name, weekGoal(a,w), arr.length, arr.map(x=>isoOf(dateOfDay(x))).join(' | ')]); }); }
  return '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n');
}
function importFromFile(file){

/* ---------- حماية البيانات: IndexedDB + تخزين دائم + ملف مرتبط ---------- */
function idb(){
  return new Promise((res, rej) => {
    if(!window.indexedDB) return rej(new Error('no idb'));
    const r = window.indexedDB.open('rahlati120', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
}
function idbGet(k){ return idb().then(db => new Promise((res, rej) => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); }
function idbSet(k, v){ return idb().then(db => new Promise((res, rej) => { const tx = db.transaction('kv','readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => res(); tx.onerror = () => rej(tx.error); })); }

}

  else if(a==='wsel'){ ui.weeklyWeek = +el.value; renderWeekly(); }
  else if(a==='noteSel'){ ui.noteDay = +el.value; renderNotes(); }
  else if(el.name==='tkind'){ const g = $('#tGoalBox'); if(g) g.style.display = el.value==='weekly' ? 'block' : 'none'; }
});
document.addEventListener('input', e => {
  const el = e.target, a = el.dataset && el.dataset.input;
  if(a==='steps') onSteps(el);
  else if(a==='note') onNote(+el.dataset.day, el.value);
  else if(a==='startPrev'){ const d = parseISO(el.value), p = $('#hijriPrev'); if(p) p.textContent = d ? fmtHijri(d) : ''; }
});
function onSteps(el){
  const i = +el.dataset.day; if(!canEdit(i)) return;
  const v = arDigits(el.value).replace(/\D/g,'').slice(0,6);
  if(v !== el.value) el.value = v;
  setSteps(i, v==='' ? null : Math.min(200000, parseInt(v,10)));
  save(); patchDay(i);
}
function onNote(i, val){
  if(!canNote(i)) return;
  const d = ensureDay(i); d.note = val.slice(0,3000);
  save();
  const lst = $('#notesList'); if(lst) lst.innerHTML = notesListHTML();
}
$('#importFile').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if(f) importFromFile(f); });
document.addEventListener('keydown', e => { if(e.key==='Escape'){ if(modalOpen) closeModal(); else closeDrawer(); } });
window.addEventListener('hashchange', route);
window.addEventListener('pagehide', () => { if(state) save(); });
function checkNewDay(){ const s = isoOf(today()); if(s !== todayStr){ todayStr = s; ui.sel=null; ui.calY=null; ui.tableWeek=null; ui.weeklyWeek=null; ui.noteDay=null; renderAll(); } }
setInterval(checkNewDay, 30000);
document.addEventListener('visibilitychange', () => { if(!document.hidden) checkNewDay(); });

/* =====================================================================
   ١١) التشغيل
   ===================================================================== */
function init(){
  const first = load();
  $('#menuBtn').innerHTML = icon('menu');
  $('#logoIc').innerHTML = icon('star',18);
  $('#nav').innerHTML = '<button class="icon-btn nav-close" data-act="menuClose" aria-label="إغلاق القائمة">'+icon('x')+'</button>' +
    TABS.map(t => '<button class="nav-btn" data-act="nav" data-tab="'+t[0]+'">'+icon(t[2],20)+'<span>'+t[1]+'</span></button>').join('');
  ui.quote = randomQuote();
  route();
  if(first){
    idbGet('state').then(raw => {
      let restored = false;
      if(raw && Object.keys(state.days).length===0 && Object.keys(state.weekly).length===0){
        try{ state = sanitize(JSON.parse(raw)); rebuildTasks(); restored = true; }catch(e){}
      }
      save(); route();
      if(restored) toast('تمت استعادة بياناتك من النسخة الاحتياطية الداخلية ✓');
    }).catch(() => { save(); });
  }else updateSaveUI();
  askPersist(); initFileLink();
}
init();
})();
</script>
